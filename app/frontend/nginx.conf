log_format request_trace '$time_iso8601 request_id=$http_x_request_id '
                         'method=$request_method uri=$uri status=$status duration=$request_time';

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log request_trace;

  location = /health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"frontend"}';
  }

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $http_x_request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
