services:
  - type: web
    name: customer-churn-ai
    runtime: docker
    dockerfilePath: ./ai-models/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8001"
      - key: MODEL_PATH
        value: /app/ai-models/models/model.joblib
      - key: METADATA_PATH
        value: /app/ai-models/models/metadata.json
      - key: SCHEMA_PATH
        value: /app/ai-models/models/schema.json

  - type: web
    name: customer-churn-backend
    runtime: docker
    dockerfilePath: ./app/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: AI_SERVICE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: customer_churn
      - key: SCHEMA_PATH
        value: /app/model_artifacts/schema.json
