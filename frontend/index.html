<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Dự đoán khách hàng rời bỏ nhà mạng</h1>
        <p>Nhập thông tin khách hàng để dự đoán bằng KNN và Decision Tree.</p>

        <form id="predictionForm">
            <label>Thời gian sử dụng (tháng)</label>
            <input type="number" id="tenure" value="4" required>

            <label>Phí hàng tháng</label>
            <input type="number" id="monthly" value="70.9" step="0.1" required>

            <label>Tổng phí đã thanh toán</label>
            <input type="number" id="total" value="273" step="0.1" required>

            <label>Loại hợp đồng</label>
            <select id="contract">
                <option value="Month-to-month">Month-to-month</option>
                <option value="One year">One year</option>
                <option value="Two year">Two year</option>
            </select>

            <button type="submit">Dự đoán</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
